    is_ambiguous: true
    flag_reason: "Can mean non-specific lightheadedness, vertigo, or presyncope."
  - term: "kamzori"
    mapped_concept: "fatigue"
    is_ambiguous: true
    flag_reason: "Can represent systemic fatigue or focal neurological weakness."
  - term: "ghabrahat"
    mapped_concept: "anxiety_or_palpitations"
    is_ambiguous: true
    flag_reason: "Can represent psychological anxiety, tachycardia, or cardiac prodrome."
