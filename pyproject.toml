[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".git",
    "__pycache__",
    "frontend",
    ".pytest_cache",
    ".hypothesis",
    "backend/alembic",
    "backend/tests",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E711", "E712", "F403", "F405", "W293", "W291", "E402", "F841"]
